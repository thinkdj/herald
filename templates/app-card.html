<article class="card">
  <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 px-5 pt-4">
    <h2 class="text-lg font-semibold tracking-tight"><a class="hover:underline" href="{{href}}">{{name}}</a></h2>
    <span class="text-sm text-stone-500 dark:text-stone-400"><span class="font-mono">{{version}}</span>{{{when}}}</span>
  </div>
  <div class="mt-2 flex flex-wrap gap-1.5 px-5 empty:hidden">{{{platforms}}}</div>
  <table class="mt-4 w-full border-t border-line text-sm dark:border-line-dark"><tbody>{{{links}}}</tbody></table>
</article>
